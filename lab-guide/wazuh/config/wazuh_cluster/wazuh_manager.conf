<!--
  Wazuh Manager Configuration
  Documentation : https://documentation.wazuh.com/current/user-manual/reference/ossec-conf/
-->

<ossec_config>

  <!-- ============================================================================ -->
  <!-- Global Configuration -->
  <!-- ============================================================================ -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wazuh.com</smtp_server>
    <email_from>ossecm@example.wazuh.com</email_from>
    <email_to>recipient@example.wazuh.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <queue_size>131072</queue_size>
  </global>

  <!-- ============================================================================ -->
  <!-- Alerts Configuration -->
  <!-- ============================================================================ -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ============================================================================ -->
  <!-- Logging Configuration -->
  <!-- ============================================================================ -->
  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- ============================================================================ -->
  <!-- Remote (Agent Communication) -->
  <!-- ============================================================================ -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Syslog (pour recevoir les logs syslog) -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed_ips>10.0.0.0/8</allowed_ips>
  </remote>

  <!-- ============================================================================ -->
  <!-- Rules Configuration -->
  <!-- ============================================================================ -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>

    <!-- Règles personnalisées -->
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- ============================================================================ -->
  <!-- Active Response -->
  <!-- ============================================================================ -->
  <global>
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost.localdomain$</white_list>
    <white_list>10.0.10.0/24</white_list>  <!-- SOC Network -->
  </global>

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>route-null</name>
    <executable>route-null</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>win_firewall_drop</name>
    <executable>win_firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Active Response pour bloquer les IPs malveillantes -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712,5713,5714,5715,5716,5717,5718,5719,5720</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- ============================================================================ -->
  <!-- Syscheck (File Integrity Monitoring) -->
  <!-- ============================================================================ -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>

    <!-- Fichiers à monitorer -->
    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>
    <directories>/opt/wazuh</directories>

    <!-- Fichiers à ignorer -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cldc</ignore>
    <ignore>/etc/mnttab</ignore>
    <ignore>/etc/vold</ignore>
    <ignore>/etc/.skip</ignore>

    <!-- Fichiers avec restrictions -->
    <directories>/etc</directories>
    <directories>/usr/bin</directories>
    <directories>/usr/sbin</directories>
    <directories>/bin</directories>
    <directories>/sbin</directories>
    <directories>/boot</directories>

    <!-- Types de fichiers à ignorer -->
    <ignore type="sregex">.log$|.swp$</ignore>

    <!-- Vérification de l'intégrité -->
    <check_all>yes</check_all>
    <realtime>yes</realtime>
    <report_changes>yes</report_changes>

    <!-- Surveillance Windows -->
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\SharedAccess\Defaults</windows_registry>
  </syscheck>

  <!-- ============================================================================ -->
  <!-- Rootcheck (Détection de rootkits) -->
  <!-- ============================================================================ -->
  <rootcheck>
    <disabled>no</disabled>
    <check_unixaudit>yes</check_unixaudit>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>

    <frequency>43200</frequency>

    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>

    <system_audit>etc/shared/system_audit_rcl.txt</system_audit>
    <system_audit>etc/shared/cis_debian_linux_rcl.txt</system_audit>
    <system_audit>etc/shared/cis_rhel_linux_rcl.txt</system_audit>
    <system_audit>etc/shared/cis_rhel5_linux_rcl.txt</system_audit>
  </rootcheck>

  <!-- ============================================================================ -->
  <!-- Vulnerability Detection -->
  <!-- ============================================================================ -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>

    <!-- Ubuntu -->
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>trusty</os>
      <os>xenial</os>
      <os>bionic</os>
      <os>focal</os>
      <os>jammy</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Debian -->
    <provider name="debian">
      <enabled>yes</enabled>
      <os>buster</os>
      <os>bullseye</os>
      <os>bookworm</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- RedHat -->
    <provider name="redhat">
      <enabled>yes</enabled>
      <os>5</os>
      <os>6</os>
      <os>7</os>
      <os>8</os>
      <os>9</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Amazon Linux -->
    <provider name="amazon">
      <enabled>yes</enabled>
      <os>2</os>
      <os>2022</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Arch Linux -->
    <provider name="arch">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>

    <!-- SUSE -->
    <provider name="suse">
      <enabled>yes</enabled>
      <os>11</os>
      <os>12</os>
      <os>15</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Windows -->
    <provider name="msu">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>

    <!-- NVD (National Vulnerability Database) -->
    <provider name="nvd">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- ============================================================================ -->
  <!-- OpenSCAP (Security Content Automation Protocol) -->
  <!-- ============================================================================ -->
  <wodle name="open-scap">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
  </wodle>

  <!-- ============================================================================ -->
  <!-- CIS-CAT (Center for Internet Security Configuration Assessment Tool) -->
  <!-- ============================================================================ -->
  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
  </wodle>

  <!-- ============================================================================ -->
  <!-- Osquery -->
  <!-- ============================================================================ -->
  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <bin_path>/usr/bin/osqueryd</bin_path>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <!-- ============================================================================ -->
  <!-- Syscollector (Inventory) -->
  <!-- ============================================================================ -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <!-- ============================================================================ -->
  <!-- SCA (Security Configuration Assessment) -->
  <!-- ============================================================================ -->
  <wodle name="sca">
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </wodle>

  <!-- ============================================================================ -->
  <!-- Syslog Output -->
  <!-- ============================================================================ -->
  <syslog_output>
    <level>3</level>
    <server>10.0.10.10</server>
    <port>514</port>
    <format>default</format>
  </syslog_output>

  <!-- ============================================================================ -->
  <!-- Integration avec MISP -->
  <!-- ============================================================================ -->
  <integration>
    <name>custom-misp_file_hashes.py</name>
    <hook_url>https://10.0.10.11:8443</hook_url>
    <api_key>MISP_API_KEY_HERE</api_key>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- ============================================================================ -->
  <!-- Integration avec Shuffle (SOAR) -->
  <!-- ============================================================================ -->
  <integration>
    <name>shuffle</name>
    <hook_url>http://10.0.10.11:3001/api/v1/hooks/wazuh-hook</hook_url>
    <level>7</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- ============================================================================ -->
  <!-- Cluster Configuration (pour déploiement multi-nodes) -->
  <!-- ============================================================================ -->
  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>c98b62a9b6169ac5f67dae55ae4a9088</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh.manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>

</ossec_config>
