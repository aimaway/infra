# ============================================================================
# Zabbix Server Configuration
# Documentation : https://www.zabbix.com/documentation/current/en/manual/appendix/config/zabbix_server
# ============================================================================

# ============================================================================
# GENERAL PARAMETERS
# ============================================================================

# This file is processed by Zabbix server.
# "ListenPort" parameter is used to specify the port on which Zabbix server will listen for incoming connections.
ListenPort=10051

# "SourceIP" parameter is used to specify the source IP address for outgoing connections.
# SourceIP=

# "DebugLevel" parameter is used to specify the debug level.
# 0 - basic info about starting and stopping of Zabbix server processes
# 1 - critical info about problems with the Zabbix server
# 2 - error information
# 3 - warnings
# 4 - for debugging (produces lots of information)
# 5 - extended debugging (produces even more information)
DebugLevel=3

# "PidFile" parameter is used to specify the PID file location.
PidFile=/var/run/zabbix/zabbix_server.pid

# "LogFile" parameter is used to specify the log file location.
LogFile=/var/log/zabbix/zabbix_server.log

# "LogFileSize" parameter is used to specify the maximum size of the log file in MB.
# 0 - disable automatic log rotation
LogFileSize=10

# ============================================================================
# DATABASE PARAMETERS
# ============================================================================

# "DBHost" parameter is used to specify the database host.
DBHost=zabbix-postgres

# "DBName" parameter is used to specify the database name.
DBName=zabbix

# "DBUser" parameter is used to specify the database user.
DBUser=zabbix

# "DBPassword" parameter is used to specify the database password.
DBPassword=zabbix_password_2027

# "DBPort" parameter is used to specify the database port.
DBPort=5432

# "DBSocket" parameter is used to specify the database socket (for Unix).
# DBSocket=/tmp/mysql.sock

# "DBDoubleNumeric" parameter is used to specify whether to convert numeric values to double.
# 0 - do not convert
# 1 - convert
DBDoubleNumeric=1

# ============================================================================
# TIMEOUT PARAMETERS
# ============================================================================

# "Timeout" parameter is used to specify the timeout in seconds for unreachable hosts.
Timeout=30

# "TrapperTimeout" parameter is used to specify the timeout in seconds for trapper processes.
TrapperTimeout=300

# "UnreachablePeriod" parameter is used to specify the period in seconds after which host is considered unreachable.
UnreachablePeriod=45

# "UnavailableDelay" parameter is used to specify the delay in seconds before checking availability of unreachable host.
UnavailableDelay=60

# "UnreachableDelay" parameter is used to specify the delay in seconds before checking availability of unreachable host.
UnreachableDelay=15

# ============================================================================
# CACHE PARAMETERS
# ============================================================================

# "CacheSize" parameter is used to specify the size of configuration cache in bytes.
# Shared memory size for caching host, item and trigger data.
CacheSize=128M

# "CacheUpdateFrequency" parameter is used to specify the frequency of configuration cache updates in seconds.
CacheUpdateFrequency=60

# "StartDBSyncers" parameter is used to specify the number of database syncers.
StartDBSyncers=4

# "HistoryCacheSize" parameter is used to specify the size of history cache in bytes.
# Shared memory size for storing history.
HistoryCacheSize=64M

# "HistoryIndexCacheSize" parameter is used to specify the size of history index cache in bytes.
# Shared memory size for indexing history cache.
HistoryIndexCacheSize=32M

# "TrendCacheSize" parameter is used to specify the size of trend cache in bytes.
# Shared memory size for caching trends.
TrendCacheSize=64M

# "TrendFunctionCacheSize" parameter is used to specify the size of trend function cache in bytes.
# Shared memory size for caching trend functions.
TrendFunctionCacheSize=32M

# "ValueCacheSize" parameter is used to specify the size of value cache in bytes.
# Shared memory size for caching item history data requests.
ValueCacheSize=128M

# ============================================================================
# PROCESS PARAMETERS
# ============================================================================

# "StartPollers" parameter is used to specify the number of pre-forked instances of pollers.
StartPollers=5

# "StartIPMIPollers" parameter is used to specify the number of pre-forked instances of IPMI pollers.
StartIPMIPollers=0

# "StartPollersUnreachable" parameter is used to specify the number of pre-forked instances of pollers for unreachable hosts.
StartPollersUnreachable=3

# "StartTrappers" parameter is used to specify the number of pre-forked instances of trappers.
StartTrappers=5

# "StartDiscoverers" parameter is used to specify the number of pre-forked instances of discoverers.
StartDiscoverers=3

# "StartHTTPPollers" parameter is used to specify the number of pre-forked instances of HTTP pollers.
StartHTTPPollers=2

# "StartTimers" parameter is used to specify the number of pre-forked instances of timers.
StartTimers=2

# "StartEscalators" parameter is used to specify the number of pre-forked instances of escalators.
StartEscalators=1

# "StartAgentPollers" parameter is used to specify the number of pre-forked instances of agent pollers.
StartAgentPollers=5

# ============================================================================
# JAVA GATEWAY PARAMETERS
# ============================================================================

# "JavaGateway" parameter is used to specify the Java gateway host.
JavaGateway=zabbix-java-gateway

# "JavaGatewayPort" parameter is used to specify the Java gateway port.
JavaGatewayPort=10052

# "StartJavaPollers" parameter is used to specify the number of pre-forked instances of Java pollers.
StartJavaPollers=3

# ============================================================================
# VMWARE PARAMETERS
# ============================================================================

# "StartVMwareCollectors" parameter is used to specify the number of pre-forked instances of VMware collectors.
StartVMwareCollectors=0

# "VMwareFrequency" parameter is used to specify the VMware cluster performance collection frequency in seconds.
VMwareFrequency=60

# "VMwarePerfFrequency" parameter is used to specify the VMware cluster performance data collection frequency in seconds.
VMwarePerfFrequency=60

# "VMwareCacheSize" parameter is used to specify the size of VMware cache in bytes.
# Shared memory size for caching VMware data.
VMwareCacheSize=8M

# "VMwareTimeout" parameter is used to specify the VMware request timeout in seconds.
VMwareTimeout=10

# ============================================================================
# SNMP TRAPPER PARAMETERS
# ============================================================================

# "SNMPTrapperFile" parameter is used to specify the SNMP trapper file.
SNMPTrapperFile=/tmp/zabbix_trapper.tmp

# "StartSNMPTrapper" parameter is used to specify the number of pre-forked instances of SNMP trappers.
# 0 - SNMP trapper is not started
# 1 - SNMP trapper is started
StartSNMPTrapper=0

# "ListenIP" parameter is used to specify the list of IP addresses for SNMP trapper to listen on.
# ListenIP=127.0.0.1

# ============================================================================
# HOUSEKEEPING PARAMETERS
# ============================================================================

# "HousekeepingFrequency" parameter is used to specify the housekeeping frequency in hours.
HousekeepingFrequency=1

# "MaxHousekeeperDelete" parameter is used to specify the maximum number of rows to delete in one housekeeping run.
MaxHousekeeperDelete=5000

# "SenderFrequency" parameter is used to specify the sender frequency in seconds.
SenderFrequency=30

# "CompressionStatus" parameter is used to specify whether to enable history compression.
# 0 - disable
# 1 - enable
CompressionStatus=1

# "CompressOlder" parameter is used to specify the age of history to compress in days.
CompressOlder=7

# "MaxHistoryTableAge" parameter is used to specify the maximum age of history tables in days.
MaxHistoryTableAge=0

# ============================================================================
# ALERTING PARAMETERS
# ============================================================================

# "AlertScriptsPath" parameter is used to specify the location of alert scripts.
AlertScriptsPath=/usr/lib/zabbix/alertscripts

# "ExternalScripts" parameter is used to specify the location of external scripts.
ExternalScripts=/usr/lib/zabbix/externalscripts

# "FpingLocation" parameter is used to specify the location of fping.
FpingLocation=/usr/bin/fping

# "Fping6Location" parameter is used to specify the location of fping6.
Fping6Location=/usr/bin/fping6

# "SSHKeyLocation" parameter is used to specify the location of SSH keys.
SSHKeyLocation=/var/lib/zabbix/sshkeys

# "LogSlowQueries" parameter is used to specify the threshold in milliseconds for logging slow queries.
LogSlowQueries=3000

# ============================================================================
# TLS PARAMETERS
# ============================================================================

# "TLSCAFile" parameter is used to specify the location of the CA certificate file.
# TLSCAFile=

# "TLSCRLFile" parameter is used to specify the location of the certificate revocation list file.
# TLSCRLFile=

# "TLSCertFile" parameter is used to specify the location of the certificate file.
# TLSCertFile=

# "TLSKeyFile" parameter is used to specify the location of the key file.
# TLSKeyFile=

# ============================================================================
# PROXY PARAMETERS
# ============================================================================

# "ProxyConfigFrequency" parameter is used to specify the proxy configuration refresh frequency in seconds.
ProxyConfigFrequency=3600

# "ProxyDataFrequency" parameter is used to specify the proxy data send frequency in seconds.
ProxyDataFrequency=1

# ============================================================================
# LOADABLE MODULES
# ============================================================================

# "LoadModulePath" parameter is used to specify the location of loadable modules.
LoadModulePath=/usr/lib/zabbix/modules

# "LoadModule" parameter is used to specify the loadable modules to load.
# LoadModule=

# ============================================================================
# WEBSERVICE PARAMETERS
# ============================================================================

# "WebServiceURL" parameter is used to specify the web service URL.
# WebServiceURL=

# ============================================================================
# STATISTICS PARAMETERS
# ============================================================================

# "StatsAllowedIP" parameter is used to specify the list of IP addresses allowed to request statistics.
# StatsAllowedIP=127.0.0.1
